<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WPNG – PMU Daily Attendance</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { 
      background: linear-gradient(135deg, #0e5ca8 0%, #00a8cc 100%); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 15px;
    }
    .card { 
      background: #ffffff; 
      padding: 30px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
      width: 100%; 
      max-width: 450px; 
      border-top: 6px solid #0e5ca8;
    }
    .header { text-align: center; margin-bottom: 25px; }
    .logo-container { width: 110px; height: 110px; margin: 10px auto 0 auto; }
    .logo-container img { width: 100%; height: 100%; object-fit: contain; }
    .header h2 { color: #0e5ca8; margin: 8px 0 0 0; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #0e5ca8; font-size: 14px; }
    input[type="text"], input[type="password"], input[type="time"], input[type="date"] {
      width: 100%; 
      padding: 11px 14px; 
      border: 1.5px solid #a2c4e8; 
      border-radius: 8px; 
      font-size: 14px;
      color: #1a365d;
      background-color: #f7fafc;
      transition: all 0.2s ease-in-out;
    }
    input[type="text"]:focus, input[type="password"]:focus, input[type="time"]:focus, input[type="date"]:focus {
      outline: none;
      border-color: #0e5ca8;
      box-shadow: 0 0 0 3px rgba(14, 92, 168, 0.15);
      background-color: #ffffff;
    }
    input[readonly] { background-color: #e2e8f0; color: #4a5568; cursor: not-allowed; border-color: #cbd5e0; }
    .error-msg { color: #e53e3e; font-size: 13px; font-weight: bold; margin-top: 5px; display: none; }
    .button-group { display: flex; justify-content: space-between; gap: 12px; margin-top: 25px; }
    .btn { flex: 1; padding: 13px; border: none; border-radius: 8px; font-weight: bold; color: #fff; cursor: pointer; transition: 0.3s; font-size: 15px; }
    .btn-active { background-color: #28a745; box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3); }
    .btn-active:hover { background-color: #218838; transform: translateY(-1px); }
    .btn-disabled { background-color: #a0aec0; opacity: 0.6; cursor: not-allowed; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(14, 40, 68, 0.6); backdrop-filter: blur(2px); justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 28px; border-radius: 14px; width: 90%; max-width: 390px; text-align: center; border-top: 5px solid #0e5ca8; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
    .modal-content h3 { margin-top: 0; color: #0e5ca8; font-size: 20px; }
    .review-details { text-align: left; background: #f0f7ff; padding: 14px; border-radius: 8px; margin: 18px 0; font-size: 14px; border-left: 4px solid #0e5ca8; }
    .review-details p { margin: 6px 0; color: #2d3748; }
    .modal-buttons { display: flex; gap: 12px; }
    .btn-edit { background-color: #ecc94b; color: #1a202c; }
    .btn-edit:hover { background-color: #d69e2e; }
    .btn-done { background-color: #0e5ca8; }
    .btn-done:hover { background-color: #0b4986; }
    .success-screen { display: none; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>WPNG – PMU Daily Attendance</h2>
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/13lWIBCgO_ueVfAOoN8Qpj4GmQ8WN49rQ" alt="Water PNG Logo">
    </div>
  </div>

  <form id="attendanceForm">
    <div class="form-group">
      <label>Date (PNG Time)</label>
      <input type="date" id="attendanceDate" readonly>
    </div>

    <div class="form-group">
      <label>Employee ID / PIN</label>
      <input type="password" id="pinInput" placeholder="Enter Employee ID" required>
    </div>

    <div class="form-group">
      <label>Employee Name</label>
      <input type="text" id="employeeName" readonly placeholder="Name will appear here">
      <div class="error-msg" id="pinError">Invalid Employee ID</div>
    </div>

    <div class="form-group">
      <label>Time (PNG Time)</label>
      <input type="time" id="attendanceTime" required>
    </div>

    <div class="button-group">
      <button type="button" id="clockInBtn" class="btn btn-disabled" disabled>Clock In</button>
      <button type="button" id="clockOutBtn" class="btn btn-disabled" disabled>Clock Out</button>
    </div>
  </form>
</div>

<!-- Review Modal -->
<div class="modal" id="reviewModal">
  <div class="modal-content">
    <div id="reviewState">
      <h3>Review Entry</h3>
      <div class="review-details">
        <p><strong>Date:</strong> <span id="revDate"></span></p>
        <p><strong>Name:</strong> <span id="revName"></span></p>
        <p><strong>Time:</strong> <span id="revTime"></span></p>
        <p><strong>Action:</strong> <span id="revType"></span></p>
      </div>
      <div class="modal-buttons">
        <button class="btn btn-edit" id="editBtn">Edit Data</button>
        <button class="btn btn-done" id="doneBtn">Done</button>
      </div>
    </div>
    
    <div class="success-screen" id="successState">
      <h3 style="color: #28a745; margin-top: 0;">Submission Successful!</h3>
      <p style="color: #4a5568;">Your attendance record has been registered.</p>
      <button class="btn btn-done" onclick="resetForm()" style="margin-top: 15px;">Return to Form</button>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTLC8273XE-WU3B1oiFbBTfHpYf7Wm-gHVY1siMfr93ZhIDYiw9wL5qpRbFMK3U1i0KQ/exec";

  // Replace ID_X and Employee Name X with your actual staff details
  let employees = {
    "1004": "Brenda NAISEN",
    "10338": "Kopi HARRISON",
    "10340": "Robin BARU",
    "10341": "David TAMBAGLE",
    "10342": "Maxton MISON",
    "10368": "Courtney BALEO",
    "10369": "Roberta TONAR",
    "10370": "Pearl KONI",
    "1115": "Essie VAVA",
    "1178": "Solomon KAWARI",
    "1188": "Kalogo KOVINA",
    "1229": "Ray K VAGI",
    "1231": "rua RONNIE",
    "1237": "Milred MULEKENA",
    "1537": "John SOHAGA",
    "1586": "Darius NAMALIU",
    "1587": "Murray TATAENG",
    "39197": "Pitiwin RAWALI",
    "39257": "Ranzolin AURERE",
    "50491": "Patrick REGIONE",
    "50584": "Stanley KIPELA",
    "50635": "Sylvia LOGOSON",
    "50636": "Joshua KANAWA",
    "50707": "Hudson BAI",
    "50714": "Ivan CHRIS",
    "50764": "William DORI",
    "65720": "Ume MOSES"
  };

  let selectedType = "";

  function setPngDateTime() {
    const optionsDate = { timeZone: "Pacific/Port_Moresby", year: "numeric", month: "2-digit", day: "2-digit" };
    const optionsTime = { timeZone: "Pacific/Port_Moresby", hour: "2-digit", minute: "2-digit", hour12: false };

    const formatterDate = new Intl.DateTimeFormat([], optionsDate);
    const formatterTime = new Intl.DateTimeFormat([], optionsTime);

    const dateParts = formatterDate.formatToParts(new Date());
    let year, month, day;
    for (const part of dateParts) {
      if (part.type === 'year') year = part.value;
      if (part.type === 'month') month = part.value;
      if (part.type === 'day') day = part.value;
    }

    const timeParts = formatterTime.formatToParts(new Date());
    let hour, minute;
    for (const part of timeParts) {
      if (part.type === 'hour') hour = part.value;
      if (part.type === 'minute') minute = part.value;
    }

    document.getElementById('attendanceDate').value = `${year}-${month}-${day}`;
    document.getElementById('attendanceTime').value = `${hour}:${minute}`;
  }

  window.addEventListener('DOMContentLoaded', () => {
    setPngDateTime();
    updateClockButtons();
  });

  document.getElementById('pinInput').addEventListener('input', function() {
    const pin = this.value.trim();
    const nameField = document.getElementById('employeeName');
    const errField = document.getElementById('pinError');

    if (pin.length >= 1) {
      if (employees[pin]) {
        nameField.value = employees[pin];
        errField.style.display = 'none';
      } else {
        nameField.value = '';
        errField.style.display = 'block';
      }
    } else {
      nameField.value = '';
      errField.style.display = 'none';
    }
  });

  document.getElementById('attendanceTime').addEventListener('input', updateClockButtons);

  function updateClockButtons() {
    const timeVal = document.getElementById('attendanceTime').value;
    const clockInBtn = document.getElementById('clockInBtn');
    const clockOutBtn = document.getElementById('clockOutBtn');

    if (!timeVal) return;

    const [hours, mins] = timeVal.split(':').map(Number);
    const totalMinutes = hours * 60 + mins;

    const start6AM = 6 * 60;
    const end12PM = 12 * 60;
    const start1201PM = 12 * 60 + 1;
    const end8PM = 20 * 60;

    clockInBtn.className = "btn btn-disabled";
    clockInBtn.disabled = true;
    clockOutBtn.className = "btn btn-disabled";
    clockOutBtn.disabled = true;

    if (totalMinutes >= start6AM && totalMinutes <= end12PM) {
      clockInBtn.className = "btn btn-active";
      clockInBtn.disabled = false;
    } else if (totalMinutes >= start1201PM && totalMinutes <= end8PM) {
      clockOutBtn.className = "btn btn-active";
      clockOutBtn.disabled = false;
    }
  }

  document.getElementById('clockInBtn').addEventListener('click', () => triggerReview('Clock In'));
  document.getElementById('clockOutBtn').addEventListener('click', () => triggerReview('Clock Out'));

  function triggerReview(type) {
    const name = document.getElementById('employeeName').value;
    if (!name) {
      alert("Please enter a valid Employee ID.");
      return;
    }
    selectedType = type;
    document.getElementById('revDate').textContent = document.getElementById('attendanceDate').value;
    document.getElementById('revName').textContent = name;
    document.getElementById('revTime').textContent = document.getElementById('attendanceTime').value;
    document.getElementById('revType').textContent = type;
    
    document.getElementById('reviewState').style.display = 'block';
    document.getElementById('successState').style.display = 'none';
    document.getElementById('reviewModal').style.display = 'flex';
  }

  document.getElementById('editBtn').addEventListener('click', () => {
    document.getElementById('reviewModal').style.display = 'none';
  });

  document.getElementById('doneBtn').addEventListener('click', () => {
    const payload = {
      pin: document.getElementById('pinInput').value.trim(),
      date: document.getElementById('attendanceDate').value,
      time: document.getElementById('attendanceTime').value,
      type: selectedType
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      document.getElementById('reviewState').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    })
    .catch(() => {
      document.getElementById('reviewState').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
    });
  });

  function resetForm() {
    document.getElementById('attendanceForm').reset();
    document.getElementById('reviewModal').style.display = 'none';
    document.getElementById('employeeName').value = '';
    
    setPngDateTime();
    updateClockButtons();
  }
</script>
</body>
</html>
